 sec.innerHTML=locked?'<div class="lockbox">🔒 '+d.date+' 과제는 해당 날짜가 되면 열려요!<br><small>오늘 과제부터 차근차근 실습해 보세요 😊</small></div>':'<h2>'+d.date+' 과제 · '+d.theme+'</h2>'+d.items.map((it,j)=>`<div class="card"><h3>${j+1}. ${it.title}</h3>${REF[i+'-'+j]?`<figure class="ref"><img src="${REF[i+'-'+j]}" alt="${it.title} 참고 사진" loading="lazy" onclick="zoom(this.src)"><figcaption>📷 참고 사진 · 누르면 크게 보여요</figcaption></figure>`:''}<p>${it.prompt}</p><div class="btns"><button class="copy" onclick="copyText(this)">📋 프롬프트 복사</button><button class="share" onclick="shareText(this)">📤 공유</button></div></div>`).join('');
 days.appendChild(sec);
});
function show(i){document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===i));document.querySelectorAll('.day').forEach((s,k)=>s.classList.toggle('active',k===i));window.scrollTo(0,0);}
function zoom(src){const z=document.getElementById('zoom');z.querySelector('img').src=src;z.classList.add('show');}
function getP(btn){return btn.closest('.card').querySelector('p').textContent;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
function copyText(btn){const txt=getP(btn);if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('복사되었습니다!'))}else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('복사되었습니다!');}}
function shareText(btn){const txt=getP(btn);if(navigator.share){navigator.share({title:'나노바나나 실습 프롬프트',text:txt}).catch(()=>{})}else{copyText(btn);toast('공유 미지원 기기 → 복사했어요');}}

let _d=new Date().toDateString();
function _chk(){if(new Date().toDateString()!==_d)location.reload();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)_chk();});
setInterval(_chk,60000);
</script></body></html>
