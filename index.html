<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 프롬프트북 505</title>
<meta name="description" content="이미지·영상 생성 프롬프트 505선 교안 — 복사하고 카카오톡으로 바로 공유하세요.">
<meta name="theme-color" content="#1F1A24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231F1A24%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22%23D9B46A%22 font-family=%22sans-serif%22 font-weight=%22800%22%3EP%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F5F1EA; --paper:#FFFDF9; --ink:#1F1A24; --ink2:#5E5666; --line:#E4DCD0;
  --accent:#6A3FA0; --accent-ink:#fff; --accent-soft:#EEE6F7; --gold:#B8862F;
  --kakao:#FEE500; --kakao-ink:#191600; --ok:#1E7A4C;
  --r:16px; --fs:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;word-break:keep-all}
body.big{--fs:19px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

/* header */
.hero{background:var(--ink);color:#F5EFE6;padding:28px 16px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(184,134,47,.45),transparent 70%)}
.hero-in{max-width:1180px;margin:0 auto;position:relative;z-index:1}
.eyebrow{font-size:.78rem;letter-spacing:.16em;color:#D9B46A;font-weight:700}
.hero h1{margin:6px 0 4px;font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.hero h1 b{color:#D9B46A}
.hero p{margin:0;color:#CFC6D8;font-size:.95rem}
.how{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.how span{font-size:.82rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:5px 10px;border-radius:999px;color:#EDE6F3}

/* toolbar */
.bar{position:sticky;top:0;z-index:20;background:rgba(245,241,234,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px 8px}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2)}
.iconbtn{height:46px;min-width:46px;padding:0 12px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.iconbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:.9rem;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips.books .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.count{font-size:.85rem;color:var(--ink2);padding:6px 0 2px}

/* grid */
main{max-width:1180px;margin:0 auto;padding:14px 16px 80px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}}
.card{background:var(--paper);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:260px 380px}
.thumb{position:relative;aspect-ratio:3/4;background:#E9E2D6;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .thumb img{transform:scale(1.03)}
.no{position:absolute;left:8px;top:8px;background:rgba(31,26,36,.82);color:#fff;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em}
.vid{position:absolute;right:8px;top:8px;background:#E0413A;color:#fff;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px}
.fav{position:absolute;right:6px;bottom:6px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:1.1rem;color:#B9AEC4}
.fav.on{color:var(--gold)}
.meta{padding:10px 10px 6px;flex:1}
.cat{font-size:.72rem;font-weight:700;color:var(--accent)}
.ttl{font-size:.95rem;font-weight:700;line-height:1.35;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 10px}
.mini{padding:9px 0;border-radius:10px;font-size:.85rem;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.mini.k{background:var(--kakao);color:var(--kakao-ink)}
.empty{text-align:center;color:var(--ink2);padding:60px 0}

/* detail */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.dim{position:absolute;inset:0;background:rgba(18,14,22,.6)}
.panel{position:absolute;inset:0;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
@media(min-width:900px){.panel{inset:4vh auto 4vh 50%;transform:translateX(-50%);width:min(1040px,94vw);border-radius:22px}}
.ptop{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,253,249,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ptop .pn{font-weight:800;font-size:.95rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:1.2rem;background:var(--paper)}
.pbody{display:grid;gap:18px;padding:16px}
@media(min-width:900px){.pbody{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start;padding:22px}}
.media{background:#EFE8DC;border-radius:14px;overflow:hidden;display:grid;place-items:center}
@media(min-width:900px){.media{position:sticky;top:80px}}
.media img,.media video{width:100%;max-height:56vh;object-fit:contain}
@media(min-width:900px){.media img,.media video{max-height:72vh}}
.dcat{display:inline-block;font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.dttl{font-size:1.4rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em;line-height:1.3}
.dsub{color:var(--ink2);font-size:.88rem;margin:0 0 14px}
.pblock{border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;background:#fff}
.plabel{font-size:.8rem;font-weight:800;color:var(--ink2);padding:10px 14px 0;letter-spacing:.04em}
.ptext{white-space:pre-wrap;padding:8px 14px 14px;font-size:1rem;line-height:1.7;max-height:46vh;overflow-y:auto;user-select:text;-webkit-user-select:text}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-top:1px solid var(--line);background:#FBF8F3}
.btn{padding:13px 8px;border-radius:12px;font-weight:800;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.copy{background:var(--ink);color:#fff}
.btn.txt{background:var(--kakao);color:var(--kakao-ink)}
.bigshare{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:480px){.bigshare{grid-template-columns:2fr 1fr}}
.btn.img{background:var(--accent);color:#fff;padding:15px 8px}
.btn.save{background:var(--paper);border:1.5px solid var(--line)}
.note{font-size:.82rem;color:var(--ink2);margin:10px 2px 0;line-height:1.5}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:.95rem;z-index:99;transition:.25s;max-width:min(92vw,460px);text-align:center;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;right:16px;bottom:18px;width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;font-size:1.3rem;display:none;place-items:center;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.totop.show{display:grid}
footer{text-align:center;color:var(--ink2);font-size:.8rem;padding:10px 16px 30px}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-in">
    <div class="eyebrow">PROMPT BOOK · 교안</div>
    <h1>AI 프롬프트북 <b>505</b></h1>
    <p>이미지·영상 생성 프롬프트를 골라 바로 복사하고, 카카오톡으로 보내 보세요.</p>
    <div class="how"><span>① 카드를 눌러 크게 보기</span><span>② 복사하기 · 텍스트 공유</span><span>③ 이미지+프롬프트 공유</span></div>
  </div>
</header>

<div class="bar">
  <div class="bar-in">
    <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="검색 (예: 고양이, 3x3, 제품)" autocomplete="off">
      </label>
      <button class="iconbtn" id="favOnly" aria-pressed="false" title="즐겨찾기만 보기">★</button>
      <button class="iconbtn" id="fontBtn" aria-pressed="false" title="글자 크게">가+</button>
    </div>
    <div class="chips books" id="books"></div>
    <div class="chips" id="cats"></div>
    <div class="count" id="count"></div>
  </div>
</div>

<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>찾는 프롬프트가 없어요. 다른 단어로 검색해 보세요.</div></main>
<footer>공유 버튼은 링크 없이 프롬프트 텍스트와 이미지만 보냅니다.</footer>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="dim" data-close></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true">
    <div class="ptop">
      <button class="round" data-close aria-label="닫기">✕</button>
      <div class="pn" id="pn"></div>
      <button class="round" id="dfav" aria-label="즐겨찾기">☆</button>
      <button class="round" id="prev" aria-label="이전">‹</button>
      <button class="round" id="next" aria-label="다음">›</button>
    </div>
    <div class="pbody">
      <div class="media" id="media"></div>
      <div>
        <span class="dcat" id="dcat"></span>
        <h2 class="dttl" id="dttl"></h2>
        <p class="dsub" id="dsub"></p>
        <div id="pblocks"></div>
        <div class="bigshare">
          <button class="btn img" id="shareImg">🖼️ 이미지 + 프롬프트 공유</button>
          <button class="btn save" id="saveImg">⬇ 이미지 저장</button>
        </div>
        <p class="note">카카오톡은 이미지와 글을 함께 받으면 이미지만 보내는 경우가 있어요. 그래서 이미지 공유를 누르면 프롬프트가 자동으로 복사됩니다. 이미지를 보낸 뒤 대화창에 <b>붙여넣기</b> 하세요.</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<button class="totop" id="totop" aria-label="맨 위로">↑</button>

<script src="prompts.js"></script>
<script>
(function(){
const DATA = window.PROMPTS || [];
const CATS = {P:'인물·화보',C:'캐릭터·일러스트',A:'제품·광고',D:'포스터·디자인',N:'동물·풍경',V:'영상'};
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let favs = new Set(store.get('pb_favs',[]));
const state = { book:0, cat:'', q:'', fav:false, list:DATA, idx:-1 };
const img = it => 'img/' + it.id + '.jpg';
const label = it => it.b + '권 ' + String(it.n).padStart(3,'0') + '번';
const allText = it => it.p.map(p => it.p.length>1 ? '['+p.l+']\n'+p.x : p.x).join('\n\n');

/* ---------- toast ---------- */
let tt; function toast(m,ms){ const t=$('#toast'); t.innerHTML=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'), ms||2200); }

/* ---------- copy ---------- */
function fallbackCopy(text){
  const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly','');
  ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); return ok;
}
async function copyText(text, silent){
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); ok=true; } }catch(e){}
  if(!ok) ok=fallbackCopy(text);
  if(!silent) toast(ok?'✅ 프롬프트를 복사했어요':'복사에 실패했어요. 글을 길게 눌러 직접 복사해 주세요');
  return ok;
}

/* ---------- share (no URL is ever passed) ---------- */
async function shareText(text){
  if(navigator.share){
    try{ await navigator.share({ text }); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  await copyText(text,true);
  toast('이 기기는 바로 공유가 안 돼서 <b>복사</b>해 두었어요.<br>카카오톡에 붙여넣기 하세요', 3200);
}
const blobCache = new Map();
function prefetch(it){
  if(blobCache.has(it.id)) return blobCache.get(it.id);
  const p = fetch(img(it)).then(r=>{ if(!r.ok) throw 0; return r.blob(); })
    .then(b=>{ const f=new File([b], 'prompt_'+it.id+'.jpg', {type:'image/jpeg'}); blobCache.set(it.id,f); return f; })
    .catch(()=>{ blobCache.delete(it.id); return null; });
  blobCache.set(it.id,p); return p;
}
async function shareImage(it){
  const text = allText(it);
  copyText(text,true);                      // 카톡이 글을 빼먹어도 붙여넣기 가능하도록
  let file = blobCache.get(it.id);
  if(!(file instanceof File)) file = await prefetch(it);
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({ files:[file], text });
      toast('📋 프롬프트도 복사돼 있어요.<br>글이 안 갔다면 대화창에 붙여넣기 하세요', 3600);
      return;
    }catch(e){ if(e && e.name==='AbortError') return; }
  }
  saveImage(it);
  toast('이미지를 저장하고 프롬프트를 복사했어요.<br>카카오톡에서 사진 첨부 후 붙여넣기 하세요', 3600);
}
function saveImage(it){
  const a=document.createElement('a'); a.href=img(it); a.download='prompt_'+it.id+'.jpg';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- filters ---------- */
function chip(text,pressed,on){ const b=document.createElement('button'); b.className='chip'; b.textContent=text; b.setAttribute('aria-pressed',pressed); b.onclick=on; return b; }
function drawChips(){
  const bk=$('#books'); bk.innerHTML='';
  [0,1,2,3,4,5].forEach(n=>{
    const c = n? DATA.filter(d=>d.b===n).length : DATA.length;
    bk.appendChild(chip((n? n+'권':'전체')+' '+c, String(state.book===n), ()=>{state.book=n; apply();}));
  });
  const ct=$('#cats'); ct.innerHTML='';
  ct.appendChild(chip('모든 종류', String(state.cat===''), ()=>{state.cat=''; apply();}));
  Object.keys(CATS).forEach(k=> ct.appendChild(chip(CATS[k], String(state.cat===k), ()=>{state.cat=k; apply();})));
}
function apply(scroll){
  const q=state.q.trim().toLowerCase().replace(/\s+/g,' ');
  const terms=q? q.split(' '):[];
  state.list = DATA.filter(d=>{
    if(state.book && d.b!==state.book) return false;
    if(state.cat && d.c!==state.cat) return false;
    if(state.fav && !favs.has(d.id)) return false;
    if(terms.length){
      const hay=(d.t+' '+CATS[d.c]+' '+d.id+' '+d.b+'-'+d.n+' '+d.p.map(p=>p.x).join(' ')).toLowerCase();
      return terms.every(t=>hay.includes(t));
    }
    return true;
  });
  drawChips(); render();
  $('#count').textContent = state.list.length+'개의 프롬프트' + (state.fav?' · 즐겨찾기':'');
  if(scroll!==false){ const top=$('.bar').offsetTop; if(window.scrollY>top) window.scrollTo({top}); }
}

/* ---------- grid ---------- */
function esc(s){ return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render(){
  const g=$('#grid');
  $('#empty').hidden = state.list.length>0;
  g.innerHTML = state.list.map((d,i)=>`
    <article class="card" data-i="${i}">
      <div class="thumb" data-open>
        <img src="${img(d)}" alt="${esc(d.t)} 예시 이미지" loading="lazy" decoding="async">
        <span class="no">${d.b}-${String(d.n).padStart(3,'0')}</span>
        ${d.c==='V'?'<span class="vid">영상</span>':''}
        <button class="fav ${favs.has(d.id)?'on':''}" data-fav aria-label="즐겨찾기">${favs.has(d.id)?'★':'☆'}</button>
      </div>
      <div class="meta" data-open><div class="cat">${CATS[d.c]}</div><div class="ttl">${esc(d.t)}</div></div>
      <div class="acts"><button class="mini" data-copy>복사</button><button class="mini k" data-share>텍스트 공유</button></div>
    </article>`).join('');
}
$('#grid').addEventListener('click',e=>{
  const card=e.target.closest('.card'); if(!card) return;
  const it=state.list[+card.dataset.i];
  if(e.target.closest('[data-fav]')){ toggleFav(it); const b=e.target.closest('[data-fav]'); b.classList.toggle('on',favs.has(it.id)); b.textContent=favs.has(it.id)?'★':'☆'; if(state.fav) apply(false); return; }
  if(e.target.closest('[data-copy]')) return copyText(allText(it));
  if(e.target.closest('[data-share]')) return shareText(allText(it));
  if(e.target.closest('[data-open]')) openAt(+card.dataset.i);
});
function toggleFav(it){
  favs.has(it.id)? favs.delete(it.id) : favs.add(it.id);
  store.set('pb_favs',[...favs]);
  toast(favs.has(it.id)?'★ 즐겨찾기에 담았어요':'즐겨찾기에서 뺐어요',1400);
}

/* ---------- detail ---------- */
function openAt(i){
  if(i<0||i>=state.list.length) return;
  state.idx=i; const it=state.list[i];
  $('#pn').textContent = it.b+'-'+String(it.n).padStart(3,'0')+'  '+it.t;
  $('#dcat').textContent = CATS[it.c];
  $('#dttl').textContent = it.t;
  $('#dsub').textContent = label(it)+' · '+(i+1)+' / '+state.list.length;
  $('#dfav').textContent = favs.has(it.id)?'★':'☆';
  $('#media').innerHTML = it.v
    ? `<video src="${it.v}" poster="${img(it)}" controls playsinline preload="metadata"></video>`
    : `<img src="${img(it)}" alt="${esc(it.t)} 예시 이미지">`;
  $('#pblocks').innerHTML = it.p.map((p,k)=>`
    <div class="pblock">
      <div class="plabel">${esc(p.l)}</div>
      <div class="ptext">${esc(p.x)}</div>
      <div class="pbtns"><button class="btn copy" data-k="${k}" data-act="copy">📋 복사하기</button><button class="btn txt" data-k="${k}" data-act="share">💬 텍스트 공유</button></div>
    </div>`).join('');
  $('#prev').disabled = i===0; $('#next').disabled = i===state.list.length-1;
  $('#prev').style.opacity = i===0?.35:1; $('#next').style.opacity = i===state.list.length-1?.35:1;
  const sh=$('#sheet'); if(!sh.classList.contains('open')){ sh.classList.add('open'); sh.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; history.pushState({d:1},'' ,'#'+it.id); }
  else history.replaceState({d:1},'','#'+it.id);
  $('#panel').scrollTop=0;
  prefetch(it);
}
function closeSheet(fromPop){
  const sh=$('#sheet'); if(!sh.classList.contains('open')) return;
  sh.classList.remove('open'); sh.setAttribute('aria-hidden','true'); document.body.style.overflow='';
  const v=$('#media video'); if(v) v.pause();
  if(!fromPop) history.back();
  document.querySelectorAll('#grid .card').forEach(c=>{ const d=state.list[+c.dataset.i]; const b=c.querySelector('[data-fav]'); const on=favs.has(d.id); b.classList.toggle('on',on); b.textContent=on?'★':'☆'; });
  if(state.fav) apply(false);
}
$('#sheet').addEventListener('click',e=>{
  if(e.target.closest('[data-close]')) return closeSheet();
  const b=e.target.closest('[data-act]'); if(!b) return;
  const it=state.list[state.idx]; const text=it.p[+b.dataset.k].x;
  b.dataset.act==='copy'? copyText(text) : shareText(text);
});
$('#prev').onclick=()=>openAt(state.idx-1);
$('#next').onclick=()=>openAt(state.idx+1);
$('#dfav').onclick=()=>{ const it=state.list[state.idx]; toggleFav(it); $('#dfav').textContent=favs.has(it.id)?'★':'☆'; };
$('#shareImg').onclick=()=>shareImage(state.list[state.idx]);
$('#saveImg').onclick=()=>{ saveImage(state.list[state.idx]); toast('이미지를 저장했어요'); };
window.addEventListener('popstate',()=>closeSheet(true));
document.addEventListener('keydown',e=>{
  if(!$('#sheet').classList.contains('open')) return;
  if(e.key==='Escape') closeSheet();
  if(e.key==='ArrowLeft') openAt(state.idx-1);
  if(e.key==='ArrowRight') openAt(state.idx+1);
});
let sx=0,sy=0;
$('#media').addEventListener('touchstart',e=>{sx=e.touches[0].clientX; sy=e.touches[0].clientY;},{passive:true});
$('#media').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) openAt(state.idx+(dx<0?1:-1));
},{passive:true});

/* ---------- toolbar ---------- */
let qt; $('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{state.q=e.target.value; apply();},180); });
$('#favOnly').onclick=()=>{ state.fav=!state.fav; $('#favOnly').setAttribute('aria-pressed',state.fav); apply(); if(state.fav&&!favs.size) toast('카드의 ☆를 눌러 즐겨찾기를 담아 보세요',2600); };
function setBig(on){ document.body.classList.toggle('big',on); $('#fontBtn').setAttribute('aria-pressed',on); store.set('pb_big',on); }
$('#fontBtn').onclick=()=>setBig(!document.body.classList.contains('big'));
setBig(store.get('pb_big',false));
window.addEventListener('scroll',()=>$('#totop').classList.toggle('show',window.scrollY>900),{passive:true});
$('#totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

apply(false);
const h=location.hash.slice(1); if(h){ const i=state.list.findIndex(d=>d.id===h); if(i>=0){ history.replaceState(null,'',location.pathname); openAt(i);} }
})();
</script>
</body>
</html>
